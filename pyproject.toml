[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-pruned-decoding"
version = "0.1.0"
description = "Dual-Pruned Decoding (DPD): Lagrangian Hull Pruning for Budget-Constrained Language Model Generation"
readme = "README.md"
authors = [
    { name = "Rajveersinh Pardeshi", email = "rajveersinh.dev@gmail.com" }
]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "matplotlib>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dpd*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
