name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Kernel
        run: python scripts/build_kernel.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,benchmarks]"

      - name: Lint with Ruff
        run: |
          python -m ruff check dpd tests

      - name: Run Pytest with Coverage
        run: |
          python -m pytest -v --cov=dpd --cov-report=xml tests/

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile LaTeX Paper
        run: |
          cd paper
          tectonic main.tex
          ls -la main.pdf

      - name: Upload Paper Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-pruned-decoding-paper
          path: paper/main.pdf

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan & Lean 4
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          for i in 1 2 3; do
            $HOME/.elan/bin/elan toolchain install leanprover/lean4:v4.35.0 && break || sleep 5
          done
          $HOME/.elan/bin/elan default leanprover/lean4:v4.35.0

      - name: Verify Lean 4 Formal Proofs
        run: |
          lean --version
          lean formal/DPDTheory.lean
